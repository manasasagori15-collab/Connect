<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Account - Climentos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="register-page">
        <div class="register-card">
            <h1>Climentos</h1>
            <h2>Create a new acoount</h2>
            <p>It's quick and easy</p>
            <div class="name-fields">
                <input type="text" id="firstName" placeholder="First Name">
                <input type="text" id="lastName" placeholder="Surname">
            </div>
            <div class="form-group">
                    <label for="dateOfBirth">Date of birth</label>
                    <input type="date" id="dateOfBirth">
            </div>
            <div class="form-group">
                <label>Gender</label>
                <div class="gender-options">
                    <label>
                        Female
                        <input type="radio" name="gender" value="Female">
                    </label>
                    <label>
                        Male
                        <input type="radio" name="gender" value="Male">
                    </label>
                    <label>
                        Other
                        <input type="radio" name="gender" value="Custom">
                    </label>
                </div>
                <div class="form-group">
                    <input type="email" id="email" placeholder="Email address">
                </div>

                <div class="form-group">
                    <input type="password" id="registerPassword" placeholder="New password">
                </div>

                <div class="form-group">
                    <input type="password" id="confirmPassword" placeholder="Confirm password">
                </div>
                <button type="button" id="registerButton" class="register-button">
                    Sign Up
                </button>
                <p id="errorMessage"></p>
                <p id="successMessage"></p>
                <p>Already have an account? 
                    <a href="index.html">Login</a>
                </p>

            </div>

        </div>

    </div>
    <script src="javascript/register.js"></script>

</body>
</html>
