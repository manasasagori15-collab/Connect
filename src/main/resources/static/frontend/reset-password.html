
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Climentos | Reset Password</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/climentos-additions.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .reset-page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;

            background: linear-gradient(
                135deg,
                #fff1f7,
                #f8eafa,
                #fff4f8
            );
        }

        .reset-card {
            width: 100%;
            max-width: 440px;
            padding: 38px;

            background: #ffffff;
            border: 1px solid #f1dfed;
            border-radius: 22px;

            box-shadow: 0 18px 50px
                rgba(177, 111, 158, 0.13);
        }

        .reset-logo {
            text-align: center;
            color: #b65d91;
            font-size: 27px;
            font-weight: 800;
            margin-bottom: 25px;
        }

        .reset-logo span {
            color: #d9a4e9;
        }

        .reset-card h1 {
            color: #a85b91;
            font-size: 25px;
            text-align: center;
            margin: 0 0 10px;
        }

        .reset-description {
            color: #927f94;
            font-size: 14px;
            line-height: 1.6;
            text-align: center;
            margin-bottom: 28px;
        }

        .reset-field {
            margin-bottom: 20px;
        }

        .reset-field label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #6f5b73;
            margin-bottom: 9px;
        }

        .password-container {
            display: flex;
            align-items: center;

            border: 1px solid #ead9e9;
            border-radius: 12px;
            overflow: hidden;
            background: #ffffff;

            transition: border-color 0.2s;
        }

        .password-container:focus-within {
            border-color: #d99ac4;
            box-shadow: 0 0 0 3px
                rgba(217, 154, 196, 0.12);
        }

        .password-container input {
            flex: 1;
            min-width: 0;

            border: none;
            outline: none;

            padding: 14px;
            font-size: 14px;

            background: transparent;
            color: #45394b;
        }

        .eye-button {
            border: none;
            background: #fbf2fa;

            color: #a65f91;
            padding: 14px;

            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
        }

        .eye-button:hover {
            background: #f5e5f2;
        }

        .password-hint {
            color: #a393a8;
            font-size: 11px;
            margin-top: 7px;
        }

        .reset-submit {
            width: 100%;
            border: none;
            border-radius: 12px;

            padding: 14px;

            background: linear-gradient(
                110deg,
                #e88eb8,
                #c89be4
            );

            color: #ffffff;
            font-size: 15px;
            font-weight: 700;

            cursor: pointer;
            margin-top: 8px;

            transition: 0.2s;
        }

        .reset-submit:hover {
            filter: brightness(0.97);
            transform: translateY(-1px);
        }

        .reset-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .reset-message {
            min-height: 22px;
            margin-top: 16px;
            text-align: center;
            font-size: 13px;
            line-height: 1.5;
        }

        .reset-message.success {
            color: #32845e;
        }

        .reset-message.error {
            color: #c34f78;
        }

        .back-login {
            text-align: center;
            margin-top: 22px;
            font-size: 13px;
        }

        .back-login a {
            color: #b65d91;
            text-decoration: none;
            font-weight: 700;
        }

        .back-login a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .reset-card {
                padding: 26px 20px;
            }
        }
    </style>

</head>

<body>

    <main class="reset-page">

        <section class="reset-card">

            <div class="reset-logo">
                climentos<span>.</span>
            </div>

            <h1>Create a new password</h1>

            <p class="reset-description">
                Choose a strong password that you haven't
                used before. Make sure you can remember it.
            </p>


            <form id="resetPasswordForm">

                <!-- NEW PASSWORD -->
                <div class="reset-field">

                    <label for="newPassword">
                        New password
                    </label>

                    <div class="password-container">

                        <input
                            type="password"
                            id="newPassword"
                            name="newPassword"
                            placeholder="Enter your new password"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="eye-button"
                            data-target="newPassword"
                            aria-label="Show password"
                        >
                            Show
                        </button>

                    </div>

                    <p class="password-hint">
                        Use at least 8 characters.
                    </p>

                </div>


                <!-- CONFIRM PASSWORD -->
                <div class="reset-field">

                    <label for="confirmPassword">
                        Confirm new password
                    </label>

                    <div class="password-container">

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Confirm your new password"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="eye-button"
                            data-target="confirmPassword"
                            aria-label="Show password"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <!-- SUBMIT BUTTON -->
                <button
                    type="submit"
                    class="reset-submit"
                    id="resetSubmit"
                >
                    Reset password
                </button>


                <!-- SUCCESS / ERROR MESSAGE -->
                <div
                    id="resetMessage"
                    class="reset-message"
                    role="status"
                    aria-live="polite"
                ></div>

            </form>


            <div class="back-login">
                <a href="index.html">
                    ← Back to login
                </a>
            </div>

        </section>

    </main>


    <script src="javascript/reset-password.js"></script>

</body>

</html>
